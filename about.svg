<svg width="1200" height="390" viewBox="0 0 1200 390"
xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#38BDF8"/>
    <stop offset="0.5" stop-color="#818CF8"/>
    <stop offset="1" stop-color="#C084FC"/>
  </linearGradient>
  <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E2E8F0"/>
    <stop offset="1" stop-color="#94A3B8"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.22"/>
  </pattern>
</defs>

<rect width="1200" height="390" fill="#0B0F16"/>
<rect x="45" y="25" width="1110" height="340" rx="22" fill="#0E141D" stroke="#1E293B"/>
<rect x="45" y="25" width="1110" height="340" rx="22" fill="url(#grid)"/>

<circle cx="150" cy="90" r="95" fill="#38BDF8" opacity="0.05" filter="url(#soft)">
  <animate attributeName="cx" values="150;260;150" dur="8s" repeatCount="indefinite"/>
</circle>

<rect x="70" y="48" width="1060" height="294" rx="18" fill="#080C12"
      stroke="url(#border)" stroke-width="1.4"/>

<rect x="70" y="48" width="1060" height="294" rx="18" fill="none"
      stroke="url(#border)" stroke-width="2" stroke-dasharray="90 900" opacity=".7">
  <animate attributeName="stroke-dashoffset" from="0" to="-990" dur="5s" repeatCount="indefinite"/>
</rect>

<!-- title bar -->
<rect x="70" y="48" width="1060" height="42" rx="18" fill="#111827"/>
<rect x="70" y="70" width="1060" height="20" fill="#111827"/>
<circle cx="96" cy="69" r="6" fill="#64748B"/>
<circle cx="118" cy="69" r="6" fill="#64748B"/>
<circle cx="140" cy="69" r="6" fill="#64748B"/>
<text x="600" y="74" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748B">
  vennela@developer-room ~ about
</text>

<g font-family="monospace">
  <text x="105" y="128" font-size="17" fill="#38BDF8">$ whoami</text>
  <text x="105" y="157" font-size="18" fill="#F8FAFC">vennela-godari</text>

  <text x="105" y="196" font-size="17" fill="#38BDF8">$ cat about.txt</text>
  <text x="105" y="224" font-size="15" fill="url(#text)">
    Software Developer building practical applications across
  </text>
  <text x="105" y="247" font-size="15" fill="url(#text)">
    Android, backend systems and AI / ML.
  </text>

  <text x="105" y="285" font-size="17" fill="#38BDF8">$ currently</text>

  <!-- neatly separated focus chips -->
  <g font-size="13">
    <rect x="105" y="300" width="125" height="28" rx="8" fill="#111827" stroke="#334155"/>
    <text x="167.5" y="318.5" text-anchor="middle" fill="#CBD5E1">Java / Python</text>

    <rect x="244" y="300" width="150" height="28" rx="8" fill="#111827" stroke="#334155"/>
    <text x="319" y="318.5" text-anchor="middle" fill="#CBD5E1">Android / Backend</text>

    <rect x="408" y="300" width="112" height="28" rx="8" fill="#111827" stroke="#334155"/>
    <text x="464" y="318.5" text-anchor="middle" fill="#CBD5E1">AI / ML</text>

    <rect x="534" y="300" width="265" height="28" rx="8" fill="#111827" stroke="#334155"/>
    <text x="666.5" y="318.5" text-anchor="middle" fill="#CBD5E1">
      DSA / Competitive Programming
    </text>
  </g>

  <!-- cursor kept clear of final chip -->
  <rect x="815" y="303" width="8" height="21" rx="1" fill="#38BDF8" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</g>

<rect x="72" y="91" width="1056" height="1" fill="#38BDF8" opacity=".15">
  <animate attributeName="y" values="92;340;92" dur="7s" repeatCount="indefinite"/>
</rect>
</svg>